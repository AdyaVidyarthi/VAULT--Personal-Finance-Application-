<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget - Personal Finance</title>
    <!-- Google Fonts: Newsreader & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/nav.css" />
    <link rel="stylesheet" href="budget.css" />
  </head>
  <body>
    <main class="dashboard-container">
      <nav class="app-navbar">
        <a href="../Home/home.html" class="nav-brand">
          <span class="nav-brand-title">Personal Finance</span>
        </a>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="../Home/home.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="../Transaction/transaction.html" class="nav-link"
              >Transactions</a
            >
          </li>
          <li class="nav-item">
            <a href="../Budget/budget.html" class="nav-link active">Budget</a>
          </li>
          <li class="nav-item">
            <a
              href="../SavingsAndInvestment/savings-investment.html"
              class="nav-link"
              >Savings & Investments</a
            >
          </li>
        </ul>
      </nav>

      <header class="budget-header">
        <div class="budget-title-section">
          <span class="eyebrow-label">Monthly Target</span>
          <h1 id="total-budget-amount" class="balance-display">₹2,000.00</h1>
          <span id="budget-period" class="as-of-label"></span>
        </div>

        <div class="stats-section">
          <div class="stat-box">
            <span class="stat-label">Total Spent</span>
            <span id="budget-total-spent" class="stat-value expense-val"
              >₹1,329.45</span
            >
          </div>
          <div class="stat-box">
            <span class="stat-label">Remaining</span>
            <span id="budget-remaining" class="stat-value income-val"
              >₹670.55</span
            >
          </div>
          <div class="stat-box">
            <span class="stat-label">Used</span>
            <span id="budget-usage-rate" class="stat-value rate-val">66%</span>
          </div>
        </div>
      </header>

      <section class="section-title-row">
        <div class="title-group">
          <h2 class="section-title">Category Budgets</h2>
          <p class="section-subtitle">
            Real-time expenditure tracked against monthly category limits
          </p>
        </div>
        <button id="add-budget-btn" class="primary-btn" type="button">
          + Set Category Budget
        </button>
      </section>

      <section id="budget-form-section" class="form-drawer hidden">
        <div class="form-drawer-inner">
          <div class="form-drawer-header">
            <h3>Set Category Budget</h3>
            <button type="button" id="close-budget-form-btn" class="close-btn">
              ✕
            </button>
          </div>
          <form id="add-budget-form">
            <div class="form-row">
              <div class="input-field">
                <label for="budget-category">Category</label>
                <select id="budget-category" required>
                  <option value="Housing">Housing</option>
                  <option value="Food">Food</option>
                  <option value="Utilities">Utilities</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Transport">Transport</option>
                  <option value="Health">Health</option>
                  <option value="Shopping">Shopping</option>
                </select>
              </div>
              <div class="input-field">
                <label for="budget-limit">Monthly Limit (₹)</label>
                <input
                  type="number"
                  id="budget-limit"
                  placeholder="e.g. 500.00"
                  step="10"
                  min="10"
                  required
                />
              </div>
              <div class="form-actions">
                <button type="submit" class="primary-btn">Save Budget</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <section
        class="categories-list"
        id="budget-categories-container"
      ></section>
    </main>

    <script src="../shared/nav.js"></script>
    <script src="../shared/api.js"></script>
    <script src="budget.js"></script>
  </body>
</html>
